<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retailer Login | StockFlow</title>
  <meta name="description" content="Sign in to your StockFlow Retail Inventory OS dashboard to manage stock, purchase orders, and store analytics.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <script>
    (function() {
      function safeGet(key, def) {
        try { return localStorage.getItem(key) || def; } catch(e) { return def; }
      }
      function safeSet(key, val) {
        try { localStorage.setItem(key, val); } catch(e) {}
      }
      window.applyTheme = function(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        safeSet('stockflow_theme', theme);
        var btns = document.querySelectorAll('.js-theme-toggle');
        for(var i=0; i<btns.length; i++) {
          btns[i].innerHTML = theme === 'dark' ? '☀️' : '🌙';
        }
      };
      window.toggleTheme = function() {
        var curr = document.documentElement.getAttribute('data-theme') || 'light';
        window.applyTheme(curr === 'dark' ? 'light' : 'dark');
      };
      window.applyRTL = function(dir) {
        document.documentElement.setAttribute('dir', dir);
        safeSet('stockflow_rtl', dir);
        var btns = document.querySelectorAll('.js-rtl-toggle');
        for(var i=0; i<btns.length; i++) {
          btns[i].innerHTML = '⇄';
        }
      };
      window.toggleRTL = function() {
        var curr = document.documentElement.getAttribute('dir') || 'ltr';
        window.applyRTL(curr === 'rtl' ? 'ltr' : 'rtl');
      };
      var initTheme = safeGet('stockflow_theme', 'light');
      var initRTL = safeGet('stockflow_rtl', 'ltr');
      document.documentElement.setAttribute('data-theme', initTheme);
      document.documentElement.setAttribute('dir', initRTL);
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page-wrapper">

  <div class="login-container">
    <!-- Top Controls Row Above Card -->
    <div class="login-top-controls">
      <button class="control-btn js-theme-toggle" id="loginThemeBtn" title="Toggle Theme" onclick="toggleTheme()">🌙</button>
      <button class="control-btn js-rtl-toggle" id="loginRTLBtn" title="Toggle RTL" onclick="toggleRTL()">⇄</button>
    </div>

    <!-- Centered Login Card -->
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 12px;">
          <div class="brand-icon" style="background: var(--brand-teal);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <div class="brand-text" style="text-align: start;">
            <span class="brand-name" style="color: var(--text-primary); font-size: 1.35rem;">STOCKFLOW</span>
            <span class="brand-desc" style="color: var(--brand-teal);">RETAIL INVENTORY OS</span>
          </div>
        </a>

        <h2 style="font-size: 1.5rem; margin-top: 16px;">WELCOME BACK</h2>
        <p style="font-size: 0.875rem; color: var(--text-muted);">Access your store inventory workspace</p>
      </div>

      <!-- Inline Error Box -->
      <div id="loginError" style="display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #EF4444; padding: 12px; border-radius: var(--radius-sm); font-size: 0.84375rem; margin-bottom: 16px; text-align: center;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail" class="form-label">Work Email</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="retailer@example.com" value="retailer@example.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword" class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" value="demo123" required>
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Toggle Password Visibility" aria-label="Toggle password visibility">
              <svg class="eye-icon eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-icon eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.84375rem;">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember me</span>
          </label>
          <a href="#" id="forgotPasswordLink">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px;">SIGN IN →</button>
      </form>

      <!-- Social Login Divider & CTAs -->
      <div class="social-login-divider">
        <span>OR CONTINUE WITH</span>
      </div>

      <div class="social-login-grid">
        <button type="button" class="btn-social btn-google" onclick="alert('Google Sign-In simulation')">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          <span>Google</span>
        </button>

        <button type="button" class="btn-social btn-apple" onclick="alert('Apple Sign-In simulation')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.12-1.96.99-3.1-.96.04-2.13.64-2.82 1.44-.61.71-1.15 1.88-1.01 3 .01 0 .04.01.07.01 1.08 0 2.17-.57 2.77-1.35z"/></svg>
          <span>Apple</span>
        </button>
      </div>

      <!-- Create Account Footer CTA -->
      <div class="signup-footer-cta">
        <span>Don't have an account?</span>
        <a href="register.html" class="signup-link">Create new account →</a>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    // Password Visibility Eye Toggle Handler
    document.addEventListener('DOMContentLoaded', () => {
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const passwordInput = document.getElementById('loginPassword');
      if (togglePasswordBtn && passwordInput) {
        togglePasswordBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          const eyeOpen = togglePasswordBtn.querySelector('.eye-open');
          const eyeClosed = togglePasswordBtn.querySelector('.eye-closed');
          if (eyeOpen && eyeClosed) {
            eyeOpen.style.display = isPassword ? 'none' : 'block';
            eyeClosed.style.display = isPassword ? 'block' : 'none';
          }
        });
      }
    });
  </script>
</body>
</html>
